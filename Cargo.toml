[workspace]
resolver = "3"
members = ["rv-core","rv-rope", "rv-script", "rv-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alexander Ng <him@alexng.dev>"]
categories = ["editor"]
repository = "https://github.com/alexng353/rv"
license = "GPL-3.0"

[package]
name = "rv"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features=["derive"] }
crossterm = "0.29.0"
