[workspace]
resolver = "3"
members = ["rv-core"]

[workspace.package]
name = "rv"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Ng <him@alexng.dev>"]
categories = ["editor"]
repository = "https://github.com/alexng353/rv"
license = "GPL-3.0"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = "2.11.1"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.23"
